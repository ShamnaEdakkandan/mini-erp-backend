            schema:
              $ref: '#/components/schemas/CustomerRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    patch:
      operationId: customers_partial_update
      description: Session-authenticated customer records scoped to their owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
