      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
          description: ''
  /api/customers/:
    get:
      operationId: customers_list
      description: Session-authenticated customer records scoped to their owner.
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: customers_create
      description: Session-authenticated customer records scoped to their owner.
      tags:
      - customers
      requestBody:
