  /api/products/:
    get:
      operationId: products_list
      description: Product catalogue and current inventory. Stock is read-only; use
        stock-movements.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Active
          - Inactive
      - in: query
        name: stock_status
        schema:
          type: string
          enum:
          - In Stock
          - Low Stock
          - Out of Stock
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: Product catalogue and current inventory. Stock is read-only; use
        stock-movements.
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            examples:
              Product:
                value:
                  name: Keyboard
                  sku: KEY-001
                  category: Electronics
                  cost: '20.00'
                  price: '35.00'
                  min: 5
                  unit: pcs
                  tax: '5.00'
                  status: Active
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
