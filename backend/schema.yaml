components:
  schemas:
    AccountError:
      type: object
      properties:
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AccountUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRoleEnum'
        workspace_id:
          type: integer
      required:
      - id
      - role
      - username
      - workspace_id
    CategoryEnum:
      enum:
      - Sales
      - Purchases
      - Expenses
      - Opening balance
      type: string
      description: |-
        * `Sales` - Sales
        * `Purchases` - Purchases
        * `Expenses` - Expenses
        * `Opening balance` - Opening balance
    Company:
      type: object
      properties:
        company:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        address:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        prefix:
          type: string
          maxLength: 30
        next_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        low_stock:
          type: boolean
        show_address:
          type: boolean
    ContactStatusEnum:
      enum:
      - Active
      - Inactive
      type: string
      description: |-
        * `Active` - Active
        * `Inactive` - Inactive
    CurrencyEnum:
      enum:
      - USD
      - INR
      - EUR
      - GBP
      type: string
      description: |-
        * `USD` - USD
        * `INR` - INR
        * `EUR` - EUR
        * `GBP` - GBP
    Customer:
      type: object
      description: Convert customer records and validate incoming contact details.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        status:
          $ref: '#/components/schemas/ContactStatusEnum'
        total:
          type: string
          readOnly: true
        balance:
          type: string
          readOnly: true
        credit:
          type: string
          readOnly: true
      required:
      - balance
      - credit
      - id
      - name
      - total
    CustomerRequest:
      type: object
      description: Convert customer records and validate incoming contact details.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        status:
          $ref: '#/components/schemas/ContactStatusEnum'
      required:
      - name
    Dashboard:
      type: object
      properties:
        sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        purchases:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        net_sales_excluding_tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        cost_of_goods:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        profit:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        receivables:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        payables:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        customer_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        supplier_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        cash_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        bank_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        products:
          type: integer
        low_stock_items:
          type: integer
        basis:
          type: string
        recent_sales:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRead'
        recent_purchases:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRead'
        recent_transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        low_stock_products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        sales_overview:
          type: array
          items:
            $ref: '#/components/schemas/Month'
      required:
      - bank_balance
      - basis
      - cash_balance
      - cost_of_goods
      - customer_credit
      - expenses
      - low_stock_items
      - low_stock_products
      - net_sales_excluding_tax
      - payables
      - products
      - profit
      - purchases
      - receivables
      - recent_purchases
      - recent_sales
      - recent_transactions
      - sales
      - sales_overview
      - supplier_credit
    DocumentKindEnum:
      enum:
      - Sale
      - Purchase Order
      - Purchase Bill
      type: string
      description: |-
        * `Sale` - Sale
        * `Purchase Order` - Purchase Order
        * `Purchase Bill` - Purchase Bill
    DocumentRead:
      type: object
      description: Response includes immutable line IDs and calculation snapshots.
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/DocumentKindEnum'
        customer:
          type: integer
          nullable: true
        supplier:
          type: integer
          nullable: true
        source_order:
          type: integer
          readOnly: true
          nullable: true
        date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentStatusEnum'
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        tax_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        cost_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          readOnly: true
        balances:
          type: object
          properties:
            returned:
              type: string
              format: decimal
            net_total:
              type: string
              format: decimal
            paid:
              type: string
              format: decimal
            balance:
              type: string
              format: decimal
            credit:
              type: string
              format: decimal
            payment_status:
              type: string
              enum:
              - Paid
              - Partial
              - Unpaid
          readOnly: true
      required:
      - balances
      - cost_total
      - currency
      - id
      - items
      - kind
      - number
      - source_order
      - status
      - subtotal
      - tax_total
      - total
    DocumentRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DocumentKindEnum'
        customer:
          type: integer
          nullable: true
        supplier:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineInputRequest'
      required:
      - items
      - kind
    DocumentStatusEnum:
      enum:
      - Draft
      - Posted
      type: string
      description: |-
        * `Draft` - Draft
        * `Posted` - Posted
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        name:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        description:
          type: string
      required:
      - category
      - id
      - name
    ExpenseRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        description:
          type: string
      required:
      - category
      - name
    Line:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tax:
          type: string
