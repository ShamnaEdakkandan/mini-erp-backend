openapi: 3.0.3
info:
  title: Folio Basic ERP API
  version: 1.0.0
  description: Workspace-isolated Basic ERP. Sign in above to try requests. Admin
    manages team/settings; Manager writes business records; Staff adds/updates business
    records without deletion. New lists use limit/offset pagination, while Customers
    keeps its existing array contract. Posted documents and stock/payment/return history
    are immutable. This is a local V1 backend, not a statutory double-entry accounting
    system.
paths:
  /api/accounting/:
    get:
      operationId: accounting_retrieve
      description: Basic cash and balance overview, not a double-entry general ledger.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      tags:
      - accounting
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
          description: ''
  /api/auth/session/:
