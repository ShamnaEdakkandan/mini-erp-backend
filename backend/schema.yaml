  /api/documents/:
    get:
      operationId: documents_list
      description: |-
        Sales, purchase orders, and purchase bills. Only drafts may be edited/deleted.

        Use kind to filter the list. Create a draft with products, then POST its post endpoint.
        Posting is atomic and cannot run twice. A purchase order reserves no stock or money.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - Purchase Bill
          - Purchase Order
          - Sale
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Draft
          - Posted
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentReadList'
          description: ''
    post:
      operationId: documents_create
      description: |-
        Sales, purchase orders, and purchase bills. Only drafts may be edited/deleted.

        Use kind to filter the list. Create a draft with products, then POST its post endpoint.
        Posting is atomic and cannot run twice. A purchase order reserves no stock or money.
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
            examples:
              SaleDraft-ReplaceIDsWithYourRecords:
                value:
                  kind: Sale
                  customer: 1
                  date: '2026-09-07'
                  discount: '0.00'
                  items:
                  - product: 1
                    quantity: 2
                    price: '35.00'
                    tax: '5.00'
                summary: Sale draft - replace IDs with your records
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'
          description: ''
