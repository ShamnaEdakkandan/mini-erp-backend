  /api/reports/{report}/:
    get:
      operationId: reports_retrieve
      description: |-
        Date-filtered report. Summary covers the full workspace/date range; search affects rows only.

        Customer/supplier balances are cumulative through date_to, ignoring date_from.
        Inventory is current. Results are paged with limit/offset; count is the full result count.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: path
        name: report
        schema:
          type: string
          enum:
          - customer-balances
          - expenses
          - inventory
          - profit-loss
          - purchases
          - sales
          - supplier-balances
        required: true
      - in: query
        name: search
        schema:
          type: string
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
          description: ''
  /api/returns/:
    get:
      operationId: returns_list
      description: |-
        Immutable sales/purchase returns. Values come from the original document lines.

        Returns change stock and reduce the amount due. Any resulting credit can be refunded
        through the document payments action with refund=true. Do not resubmit successful returns.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: document
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnList'
          description: ''
    post:
      operationId: returns_create
      description: |-
        Immutable sales/purchase returns. Values come from the original document lines.

        Returns change stock and reduce the amount due. Any resulting credit can be refunded
        through the document payments action with refund=true. Do not resubmit successful returns.
      tags:
      - returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
          description: ''
  /api/returns/{id}/:
    get:
      operationId: returns_retrieve
